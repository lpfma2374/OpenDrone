<style>
  html,body{margin:0;height:100%;background:#fff}
  three-d-stage:not(:defined){visibility:hidden}
  three-d-stage{width:100vw;height:100vh;display:block}
</style>
</head>
<body>
<three-d-stage name="OpenDrone_AC_B" background="#ffffff" autorotate></three-d-stage>
<script src="../three-d-stage.js"></script>
<script type="module">
import { AC_B } from './build.js';
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
const model = AC_B(THREE);
stage.setObject(model);

/* named camera framings, used for document stills */
const views = {
  hero:  [ 1.00, 0.42,  1.30],
  top:   [ 0.02, 1.00,  0.05],
  side:  [ 1.00, 0.06,  0.02],
  front: [ 0.06, 0.18,  1.00],
  rear:  [-0.20, 0.30, -1.00],
  low:   [ 0.85,-0.18,  0.90]
};
window.setView = (n, zoom = 1) => {
  const stg = document.querySelector('three-d-stage');
  const c = stg._camera, ctr = stg._controls;
  ctr.autoRotate = false;
  const b = new THREE.Box3().setFromObject(model);
  const s = b.getBoundingSphere(new THREE.Sphere());
  const d = (s.radius / Math.tan((c.fov * Math.PI) / 360)) * 1.25 * zoom;
  const dir = new THREE.Vector3(...(views[n] || views.hero)).normalize();
  c.position.copy(s.center).add(dir.multiplyScalar(d));
  ctr.target.copy(s.center);
  ctr.update();
};
</script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
